blueprint:
  name: Washing machine Live Update notification
  description: >-
    Pins a Live Update notification on an Android phone while the washing
    machine runs: a countdown pill in the status bar, a progress bar on the
    lock screen, and the end time in the notification shade. The notification
    is refreshed every minute and cleared when the cycle ends.

    Companion of the Samsung Washing Machine Card
    (https://github.com/Jejesar/samsung-washing-machine-card), but it works on
    its own — it only needs a state entity and a completion time entity.

    Requires Android 16 or later and a recent Home Assistant companion app.
  domain: automation
  source_url: https://github.com/Jejesar/samsung-washing-machine-card/blob/main/blueprints/automation/samsung_washing_machine_live_update.yaml
  input:
    machine_state_entity:
      name: Washer state entity
      description: SmartThings exposes it as sensor.<washer>_machine_state.
      selector:
        entity:
          domain: [sensor, binary_sensor, switch]
    completion_time_entity:
      name: Completion time entity
      description: Timestamp sensor holding the end of the cycle.
      selector:
        entity:
          domain: [sensor, input_datetime]
    notify_device:
      name: Phones
      description: >-
        The Android devices the notification is sent to. Several can be picked;
        each one gets its own Live Update.
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true
    job_state_entity:
      name: Job state entity (optional)
      description: >-
        SmartThings exposes it as sensor.<washer>_job_state. Strongly
        recommended: it is what tells a finished load from a machine that is
        still turning, whatever the machine state says.
      default: ""
      selector:
        entity:
          domain: [sensor]
    finished_job_states:
      name: Finished job states
      description: >-
        Values of the job state entity that mean the load is over. Comma
        separated.
      default: finish, finished, none
      selector:
        text:
    running_state:
      name: Running state
      description: Value of the state entity while a cycle is running.
      default: run
      selector:
        text:
    notification_title:
      name: Title
      description: Header of the notification; Android does not let it change mid-cycle.
      default: Washing machine
      selector:
        text:
    language:
      name: Language
      default: en
      selector:
        select:
          options:
            - label: English
              value: en
            - label: Français
              value: fr
            - label: Nederlands
              value: nl
    notification_icon:
      name: Icon
      default: mdi:washing-machine
      selector:
        icon:
    notification_color:
      name: Colour
      description: Accent of the notification and of the status bar pill.
      default: "#2196F3"
      selector:
        text:
    notify_service_override:
      name: Notification service (optional)
      description: >-
        Leave empty to derive the services from the phones above. Fill in a
        notify group, or a comma separated list of services, to send somewhere
        the guess cannot reach.
      default: ""
      selector:
        text:
    notify_when_finished:
      name: Notify when the cycle is over
      description: Replaces the Live Update with a normal notification once the machine stops.
      default: true
      selector:
        boolean:

mode: queued
max: 5
max_exceeded: silent

# Inputs the template trigger needs; blueprint variables are not available
# there, trigger_variables are.
trigger_variables:
  job_entity_t: !input job_state_entity
  finished_jobs_t: !input finished_job_states

variables:
  state_entity: !input machine_state_entity
  end_entity: !input completion_time_entity
  job_entity: !input job_state_entity
  finished_jobs_raw: !input finished_job_states
  phones: !input notify_device
  running: !input running_state
  lang: !input language
  notify_finished: !input notify_when_finished
  service_override: !input notify_service_override
  # mobile_app names its notify service after the device it registered. A
  # notify group counts as one service and fans out on its own, so the override
  # is the way to reach a group.
  notify_services: >-
    {% set ns = namespace(items=[]) %}
    {% if service_override %}
      {% for s in service_override.split(',') if s | trim %}
        {% set ns.items = ns.items + [s | trim] %}
      {% endfor %}
    {% else %}
      {% for d in phones %}
        {% set ns.items = ns.items + ['notify.mobile_app_' ~ (device_attr(d, 'name') | slugify)] %}
      {% endfor %}
    {% endif %}
    {{ ns.items }}
  finished_jobs: >-
    {{ finished_jobs_raw.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}
  job_finished: >-
    {{ job_entity != '' and (states(job_entity) | lower) in finished_jobs }}
  # A washer that keeps tumbling after the programme — wrinkle care, an extra
  # spin, or simply a machine left on "run" while idle — reports a state that
  # says nothing about the load, so the job state has the last word.
  is_running: "{{ states(state_entity) == running and not job_finished }}"
  # The state entity has held "run" since the cycle started, so its
  # last_changed is the start of the cycle — no helper entity needed.
  # Epoch seconds all the way down: a datetime in a variable is rendered back
  # to text before the next step reads it, an integer survives.
  started_ts: "{{ (states[state_entity].last_changed | default(now())).timestamp() | int }}"
  ends_ts: >-
    {{ (states(end_entity) | as_datetime).timestamp() | int
       if (states(end_entity) | as_datetime) is not none else 0 }}
  now_ts: "{{ now().timestamp() | int }}"
  # Last resort for a machine that never leaves "run" and has no job state: its
  # own end time is well behind us, so whatever it is doing, the cycle is over.
  # The window keeps this from firing again on every following tick.
  stale_end: "{{ ends_ts > 0 and 300 <= (now_ts - ends_ts) < 420 }}"

triggers:
  - trigger: state
    entity_id: !input machine_state_entity
    id: state_changed
  # The washer keeps re-estimating the end of the cycle.
  - trigger: state
    entity_id: !input completion_time_entity
    id: end_moved
  # Fires the moment the job state enters one of the finished values. Written
  # as a template so the blueprint stays usable without a job state entity.
  - trigger: template
    id: job_done
    value_template: >-
      {{ job_entity_t != ''
         and (states(job_entity_t) | lower)
             in (finished_jobs_t.split(',') | map('trim') | map('lower') | list) }}
  - trigger: time_pattern
    minutes: /1
    id: tick

conditions:
  # Ignore attribute-only updates.
  - condition: template
    value_template: >-
      {{ trigger.id != 'state_changed'
         or trigger.to_state.state != trigger.from_state.state | default('') }}
  # An integration dropout is not the end of a cycle: leave the notification
  # alone rather than clearing it and posting a fresh one on reconnection.
  - condition: template
    value_template: "{{ states(state_entity) not in ['unavailable', 'unknown'] }}"
  # Once everything is idle there is nothing to refresh and nothing to clear.
  - condition: template
    value_template: >-
      {{ is_running or stale_end or trigger.id in ['state_changed', 'job_done'] }}

actions:
  - choose:
      # ---- running: post or refresh the Live Update -------------------
      - conditions:
          - condition: template
            value_template: "{{ is_running and ends_ts > now_ts }}"
        sequence:
          - variables:
              total: "{{ [ends_ts - started_ts, 1] | max }}"
              elapsed: "{{ [now_ts - started_ts, 0] | max }}"
              left: "{{ [ends_ts - now_ts, 0] | max }}"
              at: "{{ ends_ts | timestamp_custom('%H:%M') }}"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: !input notification_title
                    message: >-
                      {% set h = left // 3600 %}
                      {% set m = (left % 3600) // 60 %}
                      {% set rem = (h ~ 'h' ~ '%02d' % m) if h > 0 else (m ~ ' min') %}
                      {% if lang == 'fr' %}{{ rem }} restant · fin à {{ at }}
                      {% elif lang == 'nl' %}nog {{ rem }} · klaar om {{ at }}
                      {% else %}{{ rem }} remaining · ends at {{ at }}{% endif %}
                    data:
                      tag: "washing_machine_{{ state_entity | replace('.', '_') }}"
                      live_update: true
                      progress: "{{ [elapsed, total] | min }}"
                      progress_max: "{{ total }}"
                      # The chip in the status bar shows this countdown.
                      chronometer: true
                      when: "{{ left }}"
                      when_relative: true
                      sticky: true
                      alert_once: true
                      notification_icon: !input notification_icon
                      color: !input notification_color

      # ---- over: drop the Live Update, then say it is done ------------
      - conditions:
          - condition: template
            value_template: "{{ not is_running or stale_end }}"
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "washing_machine_{{ state_entity | replace('.', '_') }}"
          # Only a real end deserves a second notification: the job state
          # entering a finished value, or the machine leaving the running
          # state while the job state has not already said so. The end time
          # has to be around now as well — an idle machine re-evaluated after
          # a Home Assistant restart is not a load that just finished.
          - condition: template
            value_template: >-
              {{ notify_finished and trigger is defined
                 and ends_ts > 0 and ((now_ts - ends_ts) | abs) <= 1800
                 and (trigger.id == 'job_done'
                      or (trigger.id == 'state_changed'
                          and trigger.from_state.state == running
                          and not job_finished)) }}
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: !input notification_title
                    message: >-
                      {% if lang == 'fr' %}Cycle terminé
                      {% elif lang == 'nl' %}Cyclus klaar
                      {% else %}Cycle finished{% endif %}
                    data:
                      tag: "washing_machine_{{ state_entity | replace('.', '_') }}_done"
                      alert_once: true
                      notification_icon: !input notification_icon
                      color: !input notification_color
